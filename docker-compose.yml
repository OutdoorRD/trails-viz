version: "3.9"

services:
  api:
    image: python:3.7-slim
    container_name: trails_viz_api_dev
    working_dir: /workspace/trails-viz-api
    environment:
      FLASK_APP: trailsvizapi
      FLASK_ENV: development
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: "5000"
      DATA_FILES_ROOT: /workspace/data-files/
      GOOGLE_APPLICATION_CREDENTIALS: /workspace/trails-viz-api/gcp_bucket_cred.json
    volumes:
      - ./trails-viz-api:/workspace/trails-viz-api
      - ../trails-viz-data/:/workspace/data-files:ro
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             flask run --host=0.0.0.0 --port=5000"

  app:
    image: node:14-bullseye-slim
    container_name: trails_viz_app_dev
    working_dir: /workspace/trails-viz-app
    volumes:
      - ./trails-viz-app:/workspace/trails-viz-app
      - app_node_modules:/workspace/trails-viz-app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - api
    command: >
      sh -c "npm install &&
             npm run serve -- --host 0.0.0.0 --port 8080"

volumes:
  app_node_modules: